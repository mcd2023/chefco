
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Merci Chef.Co — yat hizmetleri projeleri">
<meta name="theme-color" content="#0f1729">

<title>Merci Chef.Co | Projelerimiz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --navy:#0f1729;
    --navy2:#19243b;
    --gold:#c9a962;
    --cream:#f5f1eb;
    --muted:#aeb4bf;
}

* { box-sizing:border-box; }

html {
    scroll-behavior:smooth;
    scroll-padding-top:90px;
}

body {
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--cream);
    color:var(--navy);
    font-family:Montserrat,sans-serif;
}

/* HEADER */

.navbar {
    position:sticky;
    top:0;
    left:0;
    width:100%;
    min-height:76px;
    padding:12px 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    z-index:50;
    background:rgba(15,23,41,.96);
    backdrop-filter:blur(12px);
}

.logo {
    font:600 25px 'Cormorant Garamond',serif;
    color:#fff;
    text-decoration:none;
    letter-spacing:2px;
    white-space:nowrap;
}

.logo span { color:var(--gold); }

nav {
    display:flex;
    align-items:center;
    gap:22px;
}

nav a {
    color:white;
    text-decoration:none;
    font-size:11px;
    letter-spacing:1px;
    transition:color .2s;
}

nav a:hover { color:var(--gold); }

.nav-right,.langs {
    display:flex;
    align-items:center;
    gap:6px;
}

.langs button,.menu-btn {
    border:0;
    background:none;
    color:#fff;
    cursor:pointer;
    padding:7px;
    font:inherit;
    font-size:11px;
}

.langs button.active {
    color:var(--gold);
    border-bottom:1px solid var(--gold);
}

.menu-btn {
    display:none;
    font-size:24px;
}

main {
    flex:1;
    width:100%;
}

/* PROJECTS */

.projects {
    max-width:1440px;
    margin:0 auto;
    padding:38px 5% 54px;
}

.project-grid {
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:24px;
    align-items:start;
}

.project-card {
    min-width:0;
    overflow:hidden;
    background:#fffdf9;
    border:1px solid rgba(201,169,98,.5);
    border-radius:12px;
    box-shadow:0 14px 38px rgba(15,23,41,.09);
    transition:transform .25s ease,box-shadow .25s ease;
}

.project-card:hover {
    transform:translateY(-4px);
    box-shadow:0 20px 46px rgba(15,23,41,.15);
}

.project-card img {
    display:block;
    width:100%;
    height:auto;
    aspect-ratio:4/5;
    object-fit:cover;
    background:#e9e3d8;
}

.project-caption {
    padding:17px 21px 19px;
    border-top:1px solid rgba(201,169,98,.35);
}

.project-caption h2 {
    margin:0;
    color:var(--navy);
    font:600 clamp(22px,2.5vw,32px) 'Cormorant Garamond',serif;
    letter-spacing:1px;
}

.project-caption p {
    margin:6px 0 0;
    color:#656b75;
    font-size:11px;
    line-height:1.8;
    letter-spacing:1.5px;
    text-transform:uppercase;
}

/* FOOTER */

footer {
    padding:24px 5%;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:var(--navy);
    color:#d9dce2;
    border-top:1px solid rgba(201,169,98,.55);
    font-size:11px;
    letter-spacing:.5px;
}

.footer-brand {
    color:var(--gold);
    font:600 20px 'Cormorant Garamond',serif;
    letter-spacing:1.5px;
}

/* TABLET */

@media(max-width:1000px) {
    nav { gap:12px; }
    nav a { font-size:10px; }

    .projects { padding-inline:4%; }

    .project-grid {
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:20px;
    }
}

/* MOBILE */

@media(max-width:760px) {

    .navbar {
        padding:12px 5%;
    }

    .navbar nav {
        display:none;
        position:absolute;
        top:100%;
        left:0;
        width:100%;
        padding:22px 6%;
        background:var(--navy);
        flex-direction:column;
        align-items:flex-start;
        gap:22px;
        border-top:1px solid rgba(201,169,98,.3);
    }

    .navbar nav.open { display:flex; }

    .navbar nav a { font-size:12px; }

    .menu-btn { display:block; }

    .logo { font-size:21px; }

    .projects { padding:24px 4% 34px; }

    .project-grid {
        grid-template-columns:1fr;
        gap:22px;
    }

    .project-card img {
        aspect-ratio:4/3;
    }

    .project-caption {
        padding:15px 17px 17px;
    }

    footer { padding:21px 5%; }
}

@media(max-width:480px) {
    .langs { gap:0; }
    .langs button { padding:6px 4px; }
}

/* ARABIC RTL */

html[dir="rtl"] body {
    direction:rtl;
}

html[dir="rtl"] .project-caption {
    text-align:right;
}

html[dir="rtl"] .navbar nav {
    direction:rtl;
}

html[dir="rtl"] .footer-brand {
    direction:ltr;
}

/* ACCESSIBILITY */

@media(prefers-reduced-motion:reduce) {
    html { scroll-behavior:auto; }

    *,*:before,*:after {
        transition-duration:.01ms!important;
    }
}
</style>
</head>

<body>

<!-- HEADER -->

<header class="navbar" id="navbar">

<a class="logo" href="index.html">
MERCI <span>CHEF.CO</span>
</a>

<nav id="mainNav" aria-label="Ana menü">

<a href="index.html" data-i18n="navHome">ANA SAYFA</a>

<a href="index.html#projects" data-i18n="navProjects">PROJELER</a>

<a href="index.html#contacts" data-i18n="navContact">İLETİŞİM</a>

</nav>

<div class="nav-right">

<div class="langs" aria-label="Dil seçimi">

<button type="button" data-lang="tr" class="active" aria-pressed="true">TR</button>

<button type="button" data-lang="en" aria-pressed="false">EN</button>

<button type="button" data-lang="fr" aria-pressed="false">FR</button>

<button type="button" data-lang="ar" aria-pressed="false">AR</button>

</div>

<button class="menu-btn" id="menuBtn"
type="button" aria-label="Menüyü aç"
aria-expanded="false" aria-controls="mainNav">☰</button>

</div>
</header>

<!-- PROJECTS -->

<main>

<section class="projects" id="projects" aria-label="Projelerimiz">

<div class="project-grid">

<!-- ANYUTA -->

<article class="project-card">

<img
src="assets/anyuta.jpg"
alt="Merci Chef.Co — M/Y Anyuta yat içi hizmetler projesi"
fetchpriority="high"
decoding="async">

<div class="project-caption">

<h2>M/Y ANYUTA</h2>

<p data-i18n="anyuta">Yat İçi Hizmetler</p>

</div>
</article>

<!-- ISABELL -->

<article class="project-card">

<img
src="assets/isabell.jpg"
alt="Merci Chef.Co — M/Y Isabell yat hizmetleri projesi"
fetchpriority="high"
decoding="async">

<div class="project-caption">

<h2>M/Y ISABELL</h2>

<p data-i18n="isabell">Princess of the Seas · Yat İçi Hizmetler</p>

</div>
</article>

<!-- ALESTEAS -->

<article class="project-card">

<img
src="assets/alesteas.jpg"
alt="Merci Chef.Co — M/Y Alesteas yat hizmetleri projesi"
loading="lazy"
decoding="async">

<div class="project-caption">

<h2>M/Y ALESTEAS</h2>

<p data-i18n="alesteas">Yat İçi Hizmetler</p>

</div>
</article>

</div>
</section>

</main>

<!-- FOOTER -->

<footer id="footer">

<span class="footer-brand">MERCI CHEF.CO</span>

<span>
© <span id="year"></span> Merci Chef.Co.
<span data-i18n="footer">Tüm hakları saklıdır.</span>
</span>

<span data-i18n="footerTagline">Yat ve Yat İçi Hizmetler</span>

</footer>

<script>

// DÖRT DİLDE ÇEVİRİLER

const translations = {

tr:{
navHome:"ANA SAYFA",
navProjects:"PROJELER",
navContact:"İLETİŞİM",
anyuta:"Yat İçi Hizmetler",
isabell:"Princess of the Seas · Yat İçi Hizmetler",
alesteas:"Yat İçi Hizmetler",
footer:"Tüm hakları saklıdır.",
footerTagline:"Yat ve Yat İçi Hizmetler",
menuOpen:"Menüyü aç",
menuClose:"Menüyü kapat"
},

en:{
navHome:"HOME",
navProjects:"PROJECTS",
navContact:"CONTACT",
anyuta:"Onboard Services",
isabell:"Princess of the Seas · Onboard Services",
alesteas:"Onboard Services",
footer:"All rights reserved.",
footerTagline:"Yacht & Onboard Services",
menuOpen:"Open menu",
menuClose:"Close menu"
},

fr:{
navHome:"ACCUEIL",
navProjects:"PROJETS",
navContact:"CONTACT",
anyuta:"Services à bord",
isabell:"Princess of the Seas · Services à bord",
alesteas:"Services à bord",
footer:"Tous droits réservés.",
footerTagline:"Yachts et services à bord",
menuOpen:"Ouvrir le menu",
menuClose:"Fermer le menu"
},

ar:{
navHome:"الرئيسية",
navProjects:"المشاريع",
navContact:"اتصل بنا",
anyuta:"خدمات على متن اليخت",
isabell:"أميرة البحار · خدمات على متن اليخت",
alesteas:"خدمات على متن اليخت",
footer:"جميع الحقوق محفوظة.",
footerTagline:"اليخوت والخدمات على متنها",
menuOpen:"فتح القائمة",
menuClose:"إغلاق القائمة"
}

};

// YIL

document.getElementById("year").textContent =
new Date().getFullYear();

// MENÜ

const mainNav = document.getElementById("mainNav");
const menuBtn = document.getElementById("menuBtn");

function updateMenuLabel(lang) {

const c = translations[lang] || translations.tr;
const isOpen = mainNav.classList.contains("open");

menuBtn.setAttribute(
"aria-label",
isOpen ? c.menuClose : c.menuOpen
);

menuBtn.setAttribute("aria-expanded",String(isOpen));

}

// DİL DEĞİŞTİRME

function changeLanguage(lang) {

const c = translations[lang] || translations.tr;

document.documentElement.lang = lang;

document.documentElement.dir =
lang === "ar" ? "rtl" : "ltr";

document.querySelectorAll("[data-lang]").forEach(button => {

const active = button.dataset.lang === lang;

button.classList.toggle("active",active);

button.setAttribute("aria-pressed",String(active));

});

document.querySelectorAll("[data-i18n]").forEach(element => {

const key = element.dataset.i18n;

if(c[key] !== undefined) {
element.textContent = c[key];
}

});

updateMenuLabel(lang);

}

// DİL BUTONLARI

document.querySelectorAll("[data-lang]").forEach(button => {

button.addEventListener("click",() => {

changeLanguage(button.dataset.lang);

});

});

// MOBİL MENÜ

menuBtn.addEventListener("click",() => {

mainNav.classList.toggle("open");

updateMenuLabel(document.documentElement.lang);

});

mainNav.querySelectorAll("a").forEach(link => {

link.addEventListener("click",() => {

mainNav.classList.remove("open");

updateMenuLabel(document.documentElement.lang);

});

});

// İLK DİL

changeLanguage("tr");

</script>

</body>
</html>
