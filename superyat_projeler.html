<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Merci Chef.Co — yat hizmetleri projeleri">
<title>Merci Chef.Co | Projelerimiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f1729;--navy2:#19243b;--gold:#c9a962;--cream:#f5f1eb;--muted:#aeb4bf}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--cream);color:var(--navy);font-family:Montserrat,sans-serif}
/* Original site header styling and controls are retained. */
.navbar{position:sticky;top:0;left:0;width:100%;min-height:76px;padding:12px 5%;display:flex;align-items:center;justify-content:space-between;gap:18px;z-index:50;background:rgba(15,23,41,.96);backdrop-filter:blur(12px)}
.logo{font:600 25px 'Cormorant Garamond',serif;color:#fff;text-decoration:none;letter-spacing:2px;white-space:nowrap}
.logo span{color:var(--gold)}
nav{display:flex;gap:22px}
nav a{color:white;text-decoration:none;font-size:11px;letter-spacing:1px}
nav a:hover{color:var(--gold)}
.nav-right,.langs{display:flex;align-items:center;gap:6px}
.langs button,.menu-btn{border:0;background:none;color:#fff;cursor:pointer;padding:7px;font-size:11px}
.langs button.active{color:var(--gold);border-bottom:1px solid var(--gold)}
.menu-btn{display:none;font-size:24px}
main{flex:1;width:100%}
.projects{max-width:1440px;margin:0 auto;padding:38px 5% 54px}
.project-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;align-items:start}
.project-card{overflow:hidden;background:#fffdf9;border:1px solid rgba(201,169,98,.5);border-radius:12px;box-shadow:0 14px 38px rgba(15,23,41,.09);transition:transform .25s ease,box-shadow .25s ease}
.project-card:hover{transform:translateY(-4px);box-shadow:0 20px 46px rgba(15,23,41,.15)}
.project-card img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:contain;background:#e9e3d8}
.project-caption{padding:17px 21px 19px;border-top:1px solid rgba(201,169,98,.35)}
.project-caption h2{margin:0;color:var(--navy);font:600 clamp(24px,3vw,34px) 'Cormorant Garamond',serif;letter-spacing:1px}
.project-caption p{margin:6px 0 0;color:#656b75;font-size:11px;letter-spacing:2px;text-transform:uppercase}
footer{padding:24px 5%;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--navy);color:#d9dce2;border-top:1px solid rgba(201,169,98,.55);font-size:11px;letter-spacing:.5px}
.footer-brand{color:var(--gold);font:600 20px 'Cormorant Garamond',serif;letter-spacing:1.5px}
@media(max-width:1000px){nav{gap:12px}nav a{font-size:10px}}
@media(max-width:760px){
 .navbar{padding:12px 5%}
 .navbar nav{display:none;position:absolute;top:70px;left:0;width:100%;padding:22px 6%;background:var(--navy);flex-direction:column;align-items:flex-start}
 .navbar nav.open{display:flex}
 .menu-btn{display:block}
 .logo{font-size:21px}
 .projects{padding:24px 4% 34px}
 .project-grid{grid-template-columns:1fr;gap:20px}
 .project-card img{aspect-ratio:auto}
 .project-caption{padding:15px 17px 17px}
 footer{padding:21px 5%}
}
@media(max-width:480px){.langs{gap:0}.langs button{padding:6px 4px}}
</style>
</head>
<body>
<header class="navbar" id="navbar">
  <a class="logo" href="index.html">MERCI <span>CHEF.CO</span></a>
  <nav id="mainNav">
    <a href="index.html" data-i18n="navHome">ANA SAYFA</a>
    <a href="#projects" data-i18n="navProjects">PROJELER</a>
    <a href="#footer" data-i18n="navContact">İLETİŞİM</a>
  </nav>
  <div class="nav-right">
    <div class="langs" aria-label="Language">
      <button type="button" data-lang="tr" class="active" aria-pressed="true">TR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
      <button type="button" data-lang="fr" aria-pressed="false">FR</button>
      <button type="button" data-lang="ar" aria-pressed="false">AR</button>
    </div>
    <button class="menu-btn" id="menuBtn" type="button" aria-label="Menüyü aç">☰</button>
  </div>
</header>

<main>
  <section class="projects" id="projects" aria-label="Projelerimiz">
    <div class="project-grid">
      <article class="project-card">
        <img src="assets/anyuta.jpg" alt="Merci Chef.Co — M/Y Anyuta yat içi hizmetler projesi" fetchpriority="high">
        <div class="project-caption"><h2>M/Y ANYUTA</h2><p>Onboard Services</p></div>
      </article>
      <article class="project-card">
        <img src="assets/isabell.jpg" alt="Merci Chef.Co — M/Y Isabell, Princess of the Seas yat hizmetleri projesi" fetchpriority="high">
        <div class="project-caption"><h2>M/Y ISABELL</h2><p>Princess of the Seas · Onboard Services</p></div>
      </article>
    </div>
  </section>
</main>

<footer id="footer">
  <span class="footer-brand">MERCI CHEF.CO</span>
  <span>© <span id="year"></span> Merci Chef.Co. Tüm hakları saklıdır.</span>
  <span>Yacht &amp; Onboard Services</span>
</footer>
<script>
const copy={
 tr:{navHome:"ANA SAYFA",navProjects:"PROJELER",navContact:"İLETİŞİM",footer:"Tüm hakları saklıdır."},
 en:{navHome:"HOME",navProjects:"PROJECTS",navContact:"CONTACT",footer:"All rights reserved."},
 fr:{navHome:"ACCUEIL",navProjects:"PROJETS",navContact:"CONTACT",footer:"Tous droits réservés."},
 ar:{navHome:"الرئيسية",navProjects:"المشاريع",navContact:"اتصل بنا",footer:"جميع الحقوق محفوظة."}
};
document.getElementById("year").textContent=new Date().getFullYear();
document.querySelectorAll("[data-lang]").forEach(button=>button.addEventListener("click",()=>{
 const lang=button.dataset.lang;
 document.documentElement.lang=lang;
 document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 document.querySelectorAll("[data-lang]").forEach(b=>{
   b.classList.toggle("active",b===button);
   b.setAttribute("aria-pressed",String(b===button));
 });
 document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=copy[lang][el.dataset.i18n]);
 document.querySelector(".menu-btn").setAttribute("aria-label",lang==="tr"?"Menüyü aç":"Open menu");
}));
document.getElementById("menuBtn").addEventListener("click",()=>document.getElementById("mainNav").classList.toggle("open"));
document.querySelectorAll("#mainNav a").forEach(a=>a.addEventListener("click",()=>document.getElementById("mainNav").classList.remove("open")));
</script>
</body>
</html>
