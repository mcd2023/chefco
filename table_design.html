<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Merci Chef.Co — yat ve onboard hizmetleri projelerimiz.">
<meta name="theme-color" content="#0f1729">

<title>Merci Chef.Co | Projelerimiz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --navy:#0f1729;
    --navy2:#19243b;
    --gold:#c9a962;
    --cream:#f5f1eb;
    --muted:#aeb4bf;
    --white:#fffdf9;
}

* { box-sizing:border-box; }

html {
    scroll-behavior:smooth;
    scroll-padding-top:90px;
}

body {
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--cream);
    color:var(--navy);
    font-family:Montserrat,sans-serif;
}

img,video,iframe { max-width:100%; }

.navbar {
    position:sticky;
    top:0;
    width:100%;
    min-height:76px;
    padding:12px 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    z-index:50;
    background:rgba(15,23,41,.97);
    backdrop-filter:blur(12px);
}

.logo {
    font:600 25px 'Cormorant Garamond',serif;
    color:#fff;
    text-decoration:none;
    letter-spacing:2px;
    white-space:nowrap;
}

.logo span { color:var(--gold); }

nav {
    display:flex;
    align-items:center;
    gap:22px;
}

nav a {
    color:#fff;
    text-decoration:none;
    font-size:11px;
    letter-spacing:1px;
    transition:color .2s;
}

nav a:hover,nav a:focus-visible { color:var(--gold); }

.nav-right,.langs {
    display:flex;
    align-items:center;
    gap:6px;
}

.langs button,.menu-btn {
    border:0;
    background:none;
    color:#fff;
    cursor:pointer;
    padding:8px;
    font:inherit;
    font-size:11px;
}

.langs button.active {
    color:var(--gold);
    border-bottom:1px solid var(--gold);
}

.menu-btn {
    display:none;
    font-size:24px;
}

main {
    flex:1;
    width:100%;
}

.projects {
    max-width:1440px;
    margin:0 auto;
    padding:42px 5% 58px;
}

.section-heading {
    margin:0 0 28px;
    text-align:center;
}

.section-heading h1 {
    margin:0;
    font:600 clamp(32px,5vw,48px) 'Cormorant Garamond',serif;
    letter-spacing:1px;
}

.section-heading p {
    margin:8px 0 0;
    color:#656b75;
    font-size:12px;
    line-height:1.8;
    letter-spacing:1.5px;
    text-transform:uppercase;
}

.section-heading:after {
    content:"";
    display:block;
    width:58px;
    height:2px;
    margin:18px auto 0;
    background:var(--gold);
}

.project-grid {
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:18px;
    align-items:start;
}

.project-card {
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:0;
    margin:0;
    padding:0;
    overflow:hidden;
    transition:transform .3s,box-shadow .3s;
}

@media(hover:hover) {
    .project-card:hover {
        transform:translateY(-4px);
        box-shadow:0 20px 46px rgba(15,23,41,.15);
    }
}

.project-media {
    margin:0;
    padding:0;
    border:0;
    line-height:0;
}

/* 3 FOTOĞRAFLI CAROUSEL */

.project-carousel {
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    overflow:hidden;
    background:var(--navy);
}

.carousel-track {
    display:flex;
    width:100%;
    height:100%;
    transition:transform .7s ease-in-out;
}

.carousel-slide {
    flex:0 0 100%;
    width:100%;
    height:100%;
}

.carousel-slide img {
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
}

/* OKLAR */

.carousel-btn {
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    z-index:5;
    display:flex;
    align-items:center;
    justify-content:center;
    width:42px;
    height:42px;
    border:1px solid rgba(255,255,255,.5);
    border-radius:50%;
    background:rgba(15,23,41,.55);
    color:white;
    font-size:25px;
    cursor:pointer;
    transition:background .3s,border-color .3s;
}

.carousel-btn:hover {
    background:var(--gold);
    border-color:var(--gold);
}

.carousel-btn.prev { left:15px; }
.carousel-btn.next { right:15px; }

/* ALTIN GÖSTERGELER */

.carousel-dots {
    position:absolute;
    bottom:16px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:9px;
    z-index:5;
}

.carousel-dots button {
    width:9px;
    height:9px;
    padding:0;
    border:1px solid white;
    border-radius:50%;
    background:white;
    opacity:.55;
    cursor:pointer;
    transition:all .3s;
}

.carousel-dots button.active {
    width:24px;
    border-radius:10px;
    background:var(--gold);
    border-color:var(--gold);
    opacity:1;
}

/* YOUTUBE VIDEO */

.project-video {
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    overflow:hidden;
    background:#080d17;
    margin:0;
    padding:0;
    border:0;
    border-radius:0;
}

.project-video iframe,
.project-video video {
    position:absolute;
    inset:0;
    display:block;
    width:100%;
    height:100%;
    border:0;
    object-fit:contain;
}

.video-fallback {
    padding:10px 18px;
    background:#080d17;
    text-align:right;
}

.video-fallback a {
    color:var(--gold);
    font-size:12px;
    text-decoration:none;
}

.video-fallback a:hover { text-decoration:underline; }

.project-caption {
    margin:0;
    padding:12px 0 0;
    line-height:1.4;
}

.project-caption h2 {
    margin:0;
    color:var(--navy);
    font:600 clamp(25px,3vw,34px) 'Cormorant Garamond',serif;
    letter-spacing:1px;
}

.project-caption p {
    margin:7px 0 0;
    color:#656b75;
    font-size:11px;
    line-height:1.8;
    letter-spacing:1.5px;
    text-transform:uppercase;
}

/* FOOTER */

footer {
    padding:24px 5%;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:var(--navy);
    color:#d9dce2;
    border-top:1px solid rgba(201,169,98,.55);
    font-size:11px;
    line-height:1.8;
    letter-spacing:.5px;
}

.footer-brand {
    color:var(--gold);
    font:600 20px 'Cormorant Garamond',serif;
    letter-spacing:1.5px;
}

html[dir=rtl] .section-heading,
html[dir=rtl] .project-caption {
    text-align:right;
}

/* TABLET */

@media(max-width:1000px) {
    nav { gap:12px; }
    nav a { font-size:10px; }
    .navbar { padding-inline:4%; }
    .projects { padding-inline:4%; }
    .project-grid { gap:20px; }
}

/* MOBİL */

@media(max-width:760px) {
    .navbar {
        min-height:68px;
        padding:12px 4%;
    }

    .navbar nav {
        display:none;
        position:absolute;
        top:100%;
        left:0;
        width:100%;
        padding:22px 6%;
        background:var(--navy);
        flex-direction:column;
        align-items:flex-start;
        gap:22px;
        border-top:1px solid rgba(201,169,98,.3);
    }

    .navbar nav.open { display:flex; }
    .navbar nav a { font-size:12px; }
    .menu-btn { display:block; }
    .logo { font-size:21px; }

    .projects { padding:30px 4% 38px; }

    .project-grid {
        grid-template-columns:1fr;
        gap:22px;
    }

    .project-carousel {
        aspect-ratio:16/9;
    }

    .carousel-btn {
        width:36px;
        height:36px;
        font-size:22px;
    }

    .carousel-btn.prev { left:10px; }
    .carousel-btn.next { right:10px; }

    .project-caption { padding:16px 17px 19px; }

    footer { padding:22px 5%; }
}

@media(max-width:380px) {
    .logo {
        font-size:18px;
        letter-spacing:1px;
    }

    .langs { gap:0; }
    .langs button { padding:7px 4px; }
    .nav-right { gap:2px; }
}

@media(prefers-reduced-motion:reduce) {
    html { scroll-behavior:auto; }
    *,*:before,*:after {
        transition-duration:.01ms!important;
    }
}
</style>
</head>

<script>

// DİL DESTEĞİ

const translations = {
tr:{
navHome:"ANA SAYFA",
navProjects:"PROJELER",
navContact:"İLETİŞİM",
heading:"Projelerimiz",
subtitle:"Yatlarda ayrıcalıklı hizmet ve deneyimler",
footer:"Tüm hakları saklıdır.",
footerTagline:"Yat ve Yat İçi Hizmetler",
menuOpen:"Menüyü aç",
menuClose:"Menüyü kapat"
},

en:{
navHome:"HOME",
navProjects:"PROJECTS",
navContact:"CONTACT",
heading:"Our Projects",
subtitle:"Exclusive services and experiences aboard yachts",
footer:"All rights reserved.",
footerTagline:"Yacht & Onboard Services",
menuOpen:"Open menu",
menuClose:"Close menu"
},

fr:{
navHome:"ACCUEIL",
navProjects:"PROJETS",
navContact:"CONTACT",
heading:"Nos projets",
subtitle:"Services et expériences exclusifs à bord",
footer:"Tous droits réservés.",
footerTagline:"Yachts et services à bord",
menuOpen:"Ouvrir le menu",
menuClose:"Fermer le menu"
},

ar:{
navHome:"الرئيسية",
navProjects:"المشاريع",
navContact:"اتصل بنا",
heading:"مشاريعنا",
subtitle:"خدمات وتجارب مميزة على متن اليخوت",
footer:"جميع الحقوق محفوظة.",
footerTagline:"اليخوت والخدمات على متنها",
menuOpen:"فتح القائمة",
menuClose:"إغلاق القائمة"
}
};

const mainNav = document.getElementById("mainNav");
const menuBtn = document.getElementById("menuBtn");

document.getElementById("year").textContent =
new Date().getFullYear();

function updateMenuLabel(lang=document.documentElement.lang) {

const c = translations[lang] || translations.tr;
const open = mainNav.classList.contains("open");

menuBtn.setAttribute(
"aria-label",
open ? c.menuClose : c.menuOpen
);

menuBtn.setAttribute("aria-expanded",String(open));
}

// DİL DEĞİŞTİRME

document.querySelectorAll("[data-lang]").forEach(button => {

button.addEventListener("click",() => {

const lang = button.dataset.lang;
const c = translations[lang];

document.documentElement.lang = lang;

document.documentElement.dir =
lang === "ar" ? "rtl" : "ltr";

document.querySelectorAll("[data-lang]").forEach(item => {

const active = item === button;

item.classList.toggle("active",active);

item.setAttribute("aria-pressed",String(active));

});

document.querySelectorAll("[data-i18n]").forEach(el => {

const key = el.dataset.i18n;

if(c[key] !== undefined) {
el.textContent = c[key];
}

});

updateMenuLabel(lang);

});

});

// MOBİL MENÜ

menuBtn.addEventListener("click",() => {

mainNav.classList.toggle("open");

updateMenuLabel();

});

mainNav.querySelectorAll("a").forEach(link => {

link.addEventListener("click",() => {

mainNav.classList.remove("open");

updateMenuLabel();

});

});

// CAROUSEL SİSTEMİ

document.querySelectorAll(".project-carousel").forEach(carousel => {

const track = carousel.querySelector(".carousel-track");

const slides = carousel.querySelectorAll(".carousel-slide");

const prevBtn = carousel.querySelector(".prev");

const nextBtn = carousel.querySelector(".next");

const dots = carousel.querySelectorAll(".carousel-dots button");

let currentSlide = 0;
let timer;

const reducedMotion = window.matchMedia(
"(prefers-reduced-motion: reduce)"
).matches;

// FOTOĞRAF DEĞİŞTİRME

function showSlide(index) {

currentSlide = (index + slides.length) % slides.length;

track.style.transform =
`translateX(-${currentSlide * 100}%)`;

dots.forEach((dot,i) => {

dot.classList.toggle("active",i === currentSlide);

if(i === currentSlide) {
dot.setAttribute("aria-current","true");
} else {
dot.removeAttribute("aria-current");
}

});

}

// OTOMATİK GEÇİŞ

function nextSlide() {
showSlide(currentSlide + 1);
}

function startTimer() {

clearInterval(timer);

if(!reducedMotion) {
timer = setInterval(nextSlide,4000);
}

}

function resetTimer() {
startTimer();
}

// OKLAR

nextBtn.addEventListener("click",() => {

nextSlide();

resetTimer();

});

prevBtn.addEventListener("click",() => {

showSlide(currentSlide - 1);

resetTimer();

});

// NOKTALAR

dots.forEach((dot,index) => {

dot.addEventListener("click",() => {

showSlide(index);

resetTimer();

});

});

// İMLEÇ CAROUSEL ÜZERİNDEYKEN OTOMATİK KAYDIRMAYI DURDUR

carousel.addEventListener("mouseenter",() => {
clearInterval(timer);
});

carousel.addEventListener("mouseleave",() => {
startTimer();
});

// MOBİL DOKUNMATİK KAYDIRMA

let touchStartX = 0;

carousel.addEventListener("touchstart",event => {

touchStartX = event.changedTouches[0].screenX;

},{passive:true});

carousel.addEventListener("touchend",event => {

const touchEndX = event.changedTouches[0].screenX;

const difference = touchStartX - touchEndX;

if(Math.abs(difference) > 50) {

if(difference > 0) {
nextSlide();
} else {
showSlide(currentSlide - 1);
}

resetTimer();

}

},{passive:true});

// İLK FOTOĞRAF

showSlide(0);

startTimer();

});

</script>
