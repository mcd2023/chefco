
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Merci Chef.Co | Yönetim</title>
<style>
body{margin:0;padding:24px;background:#151410;color:#f8f4eb;font:15px Arial,sans-serif}
main{max-width:650px;margin:30px auto}
section{background:#24221c;border:1px solid #514832;border-radius:14px;padding:24px;margin-bottom:20px}
h1,h2{color:#d7b66b}
label{display:block;margin:15px 0 7px;color:#c9c1b1}
input,select{box-sizing:border-box;width:100%;padding:13px;background:#151410;color:white;border:1px solid #655a40;border-radius:8px}
button{padding:13px 18px;margin-top:16px;border:0;border-radius:8px;background:#d7b66b;color:#17140d;font-weight:bold;cursor:pointer}
.status{white-space:pre-wrap;line-height:1.6}
.hidden{display:none}
.item{padding:12px;border-bottom:1px solid #514832}
small{color:#c9c1b1}
</style>
</head>
<body>
<main>
<h1>MERCI CHEF.CO</h1>
<p>Yönetici paneli · Günlük müsaitlik yönetimi</p>

<section id="loginPanel">
<h2>Yönetici girişi</h2>
<form id="loginForm">
<label for="username">Kullanıcı adı</label>
<input id="username" autocomplete="username" required>
<label for="password">Parola</label>
<input id="password" type="password" autocomplete="current-password" required>
<button type="submit" id="loginBtn">Giriş yap</button>
</form>
<p id="loginStatus" class="status"></p>
</section>

<section id="dashboard" class="hidden">
<button id="logoutBtn">Çıkış yap</button>
<h2>Şef müsaitliği</h2>

<label for="chef">Şef</label>
<select id="chef"></select>

<label for="date">Tarih</label>
<input id="date" type="date">

<label for="available">Durum</label>
<select id="available">
<option value="true">Müsait</option>
<option value="false">Müsait değil</option>
</select>

<button id="saveBtn">Durumu kaydet</button>
<button id="refreshBtn">Takvimi yenile</button>
<p id="status" class="status"></p>

<h2>Kayıtlı gelecek tarihler</h2>
<div id="records"><small>Yükleniyor...</small></div>
</section>
</main>

<script>
const API = "https://merci-chefco-api.onrender.com";
let token = "";

const $ = id => document.getElementById(id);

async function api(path, options = {}) {
  const headers = {"Content-Type":"application/json"};
  if (token) headers.Authorization = "Bearer " + token;

  let response;
  try {
    response = await fetch(API + path, {...options, headers});
  } catch {
    throw new Error("API bağlantısı kurulamadı. Render FRONTEND_URL ayarını kontrol et.");
  }

  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || "İşlem başarısız.");
  return data;
}

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("loginBtn").disabled = true;
  $("loginStatus").textContent = "";

  try {
    const result = await api("/api/admin/login", {
      method:"POST",
      body:JSON.stringify({
        username:$("username").value.trim(),
        password:$("password").value
      })
    });

    token = result.token;
    $("password").value = "";
    $("loginPanel").classList.add("hidden");
    $("dashboard").classList.remove("hidden");
    await loadChefs();
  } catch (error) {
    $("loginStatus").textContent = error.message;
  } finally {
    $("loginBtn").disabled = false;
  }
});

async function loadChefs() {
  const result = await api("/api/chefs");
  const select = $("chef");
  select.replaceChildren();

  (result.chefs || []).forEach(chef => {
    select.add(new Option(chef.name, chef.id));
  });

  if (!select.value) {
    $("records").textContent = "Aktif şef bulunamadı.";
    return;
  }

  await loadAvailability();
}

async function loadAvailability() {
  $("records").replaceChildren();

  try {
    const result = await api(
      "/api/chefs/" + encodeURIComponent($("chef").value) +
      "/daily-availability"
    );

    if (!result.availability?.length) {
      $("records").textContent = "Kayıtlı gelecek tarih yok.";
      return;
    }

    result.availability.forEach(item => {
      const row = document.createElement("div");
      row.className = "item";
      const date = String(item.available_date).slice(0,10);
      row.textContent = date + " — " +
        (item.is_available ? "Müsait" : "Müsait değil");
      $("records").append(row);
    });
  } catch (error) {
    $("status").textContent = error.message;
  }
}

$("chef").addEventListener("change", loadAvailability);
$("refreshBtn").addEventListener("click", loadAvailability);

$("saveBtn").addEventListener("click", async () => {
  if (!$("chef").value || !$("date").value) {
    $("status").textContent = "Şef ve tarih seçmelisin.";
    return;
  }

  $("saveBtn").disabled = true;

  try {
    await api(
      "/api/admin/chefs/" + encodeURIComponent($("chef").value) +
      "/daily-availability",
      {
        method:"PUT",
        body:JSON.stringify({
          date:$("date").value,
          isAvailable:$("available").value === "true"
        })
      }
    );

    $("status").textContent = "Müsaitlik kaydedildi.";
    await loadAvailability();
  } catch (error) {
    $("status").textContent = error.message;
  } finally {
    $("saveBtn").disabled = false;
  }
});

$("logoutBtn").addEventListener("click", () => {
  token = "";
  $("dashboard").classList.add("hidden");
  $("loginPanel").classList.remove("hidden");
  $("loginForm").reset();
  $("status").textContent = "";
});

const today = new Date();
$("date").value = [
  today.getFullYear(),
  String(today.getMonth()+1).padStart(2,"0"),
  String(today.getDate()).padStart(2,"0")
].join("-");
</script>
</body>
</html>
